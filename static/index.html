<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>EV Battery Temperature Prediction</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background: #f5f5f5;
    }

    .box {
      background: #fff;
      padding: 30px 36px;
      border-radius: 8px;
      border: 1px solid #ddd;
      width: 380px;
    }

    h1 {
      font-size: 1.2rem;
      margin: 0 0 4px;
    }

    p.sub {
      font-size: 0.8rem;
      color: #888;
      margin: 0 0 20px;
    }

    label {
      display: block;
      font-size: 0.85rem;
      margin-bottom: 3px;
    }

    input {
      width: 100%;
      padding: 7px;
      margin-bottom: 14px;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
    }

    button {
      width: 100%;
      padding: 9px;
      border: none;
      border-radius: 4px;
      background: #4a7cf7;
      color: #fff;
      font-size: 0.95rem;
      cursor: pointer;
    }

    button:hover {
      background: #3a6ae0;
    }

    #result {
      margin-top: 16px;
      font-size: 0.95rem;
    }
  </style>
</head>

<body>

  <div class="box">
    <h1>EV Battery T<sub>max</sub> Prediction</h1>
    <p class="sub">Random Forest Regression Model</p>

    <label>Hartmann Number (Ha)</label>
    <input type="number" id="ha" step="any" placeholder="e.g. 30" />

    <label>Nanoparticle Volume Fraction (φ)</label>
    <input type="number" id="phi" step="any" placeholder="e.g. 0.03" />

    <label>Inlet Flow Velocity (u_in)</label>
    <input type="number" id="u_in" step="any" placeholder="e.g. 0.20" />

    <button id="predictBtn">Predict</button>

    <div id="result"></div>
  </div>

  <script>
    document.getElementById('predictBtn').addEventListener('click', async () => {
      const ha = document.getElementById('ha').value;
      const phi = document.getElementById('phi').value;
      const u_in = document.getElementById('u_in').value;
      const resultEl = document.getElementById('result');

      if (!ha || !phi || !u_in) {
        resultEl.textContent = 'Please fill in all fields.';
        return;
      }

      try {
        const res = await fetch('/predict', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ ha: +ha, phi: +phi, u_in: +u_in })
        });
        const data = await res.json();
        resultEl.innerHTML =
          '<b>Predicted T_max:</b> ' + data.t_max + ' °C &nbsp; | &nbsp; ' +
          '<b>Condition:</b> ' + data.condition;
      } catch (e) {
        resultEl.textContent = 'Error: is the server running?';
      }
    });
  </script>

</body>

</html>
